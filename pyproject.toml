[project]
name = "imagemagickmagick"
version = "0.1.0"
description = "ImageMagick with natural language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "llama-cpp-python>=0.3.0",
    "huggingface-hub>=0.23",
]

[project.scripts]
imagemagickmagick = "imagemagickmagick.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
